<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VladBlog Collectibles</title>
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
    <script>
      window.Telegram?.WebApp?.ready?.();
      const webApp = window.Telegram?.WebApp;
      const supportsTelegramVersion = (requiredMajor, requiredMinor) => {
        const [major = 0, minor = 0] = String(webApp?.version || "")
          .split(".")
          .map(Number);

        if (!Number.isFinite(major) || !Number.isFinite(minor)) {
          return false;
        }

        return (
          major > requiredMajor ||
          (major === requiredMajor && minor >= requiredMinor)
        );
      };
      if (supportsTelegramVersion(7, 7)) {
        webApp?.disableVerticalSwipes?.();
      }
      webApp?.expand?.();
      try {
        if (!webApp?.isFullscreen && supportsTelegramVersion(8, 0)) {
          webApp?.requestFullscreen?.();
        }
      } catch (_error) {
        webApp?.expand?.();
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
