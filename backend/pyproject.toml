[project]
name = "vladik-collectibles-backend"
version = "0.1.0"
description = "FastAPI backend for the VladBlog Collectibles Telegram Mini App MVP."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "greenlet>=3.1.0",
    "PyJWT>=2.10.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "typing-extensions>=4.12.0",
    "uvicorn[standard]>=0.30.0",
    "pillow>=12.2.0",
    "python-multipart>=0.0.30",
    "openai>=2.40.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
