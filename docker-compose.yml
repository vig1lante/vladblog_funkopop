services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      SERVICE_LOG_PATH: /project_data/logs/postgres.log
    entrypoint: ["sh", "/usr/local/bin/service-log-entrypoint.sh"]
    command: ["docker-entrypoint.sh", "postgres"]
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./project_data/logs:/project_data/logs
      - ./scripts/service-log-entrypoint.sh:/usr/local/bin/service-log-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vladik_collectibles}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/vladik_collectibles}
      LOCAL_STORAGE_PATH: /project_data/media
      GENERATION_AUDIT_LOG_PATH: /project_data/logs/generation-audit.jsonl
      SERVICE_LOG_PATH: /project_data/logs/backend.log
    entrypoint: ["sh", "/usr/local/bin/service-log-entrypoint.sh"]
    command: ["/app/docker-entrypoint.sh"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./project_data/media:/project_data/media
      - ./project_data/logs:/project_data/logs
      - ./scripts/service-log-entrypoint.sh:/usr/local/bin/service-log-entrypoint.sh:ro

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8000}
      VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-warn}
      SERVICE_LOG_PATH: /project_data/logs/frontend.log
    entrypoint: ["sh", "/usr/local/bin/service-log-entrypoint.sh"]
    command:
      [
        "docker-entrypoint.sh",
        "npm",
        "run",
        "dev",
        "--",
        "--host",
        "0.0.0.0",
        "--port",
        "5173",
      ]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./project_data/logs:/project_data/logs
      - ./scripts/service-log-entrypoint.sh:/usr/local/bin/service-log-entrypoint.sh:ro

  bot:
    build:
      context: ./backend
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      SERVICE_LOG_PATH: /project_data/logs/bot.log
    entrypoint: ["sh", "/usr/local/bin/service-log-entrypoint.sh"]
    command: ["uv", "run", "python", "-m", "app.bot"]
    volumes:
      - ./backend:/app
      - ./project_data/logs:/project_data/logs
      - ./scripts/service-log-entrypoint.sh:/usr/local/bin/service-log-entrypoint.sh:ro

volumes:
  frontend_node_modules:
